# Testes em todo push e pull request, no Windows e no Linux: a lógica (preset, gerenciador) e a
# janela de verdade (tests/test_janela.py), que no Linux roda num display virtual (Xvfb).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    name: Testes (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Dependências (Windows)
        if: runner.os == 'Windows'
        run: python -m pip install -r requirements.txt pytest==8.3.5

      - name: Dependências (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth libgtk-3-0 libnotify4 \
            libsdl2-2.0-0 libxtst6 libxxf86vm1
          python -m pip install --only-binary wxPython \
            -f https://extras.wxpython.org/wxPython4/extras/linux/gtk3/ubuntu-22.04/ \
            -r requirements.txt pytest==8.3.5

      - name: Compilar todos os módulos
        run: python -m compileall -q -x "[/\\]\.venv" .

      - name: Testes (Windows)
        if: runner.os == 'Windows'
        run: python -m pytest -v

      - name: Testes (Linux, display virtual)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m pytest -v
