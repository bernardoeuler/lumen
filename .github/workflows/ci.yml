# Testes em todo push e pull request, no Windows e no Linux.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    name: Testes (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # só o necessário para a lógica (preset, gerenciador); a GUI é exercitada no build da release
      - name: Instalar dependências
        run: python -m pip install hidapi==0.15.0 pytest==8.3.5

      - name: Compilar todos os módulos
        run: python -m compileall -q .

      - name: Testes
        run: python -m pytest
